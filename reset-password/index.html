<main>

<!-- =====================================================
     RESET PASSWORD FORM SECTION
===================================================== -->

<section class="section signup-section">

  <div class="container signup-container">

    <div class="form-wrapper">

      <div class="hero-label">
        Asbily Platforms
      </div>

      <h1 class="signup-title">
        Set New Password
      </h1>

      <p class="signup-subtitle">
        Please enter a new password for your Asbily Account.
      </p>

      <form id="resetForm" class="auth-form" novalidate>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="Create a strong password" required>
          <span class="error-msg" id="newPasswordError"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your new password" required>
          <span class="error-msg" id="confirmPasswordError"></span>
        </div>

        <span class="error-msg" id="generalError" style="margin-top: 5px;"></span>

        <button type="submit" id="submitBtn" class="button button-black form-submit-btn">
          Update Password
        </button>

        <div class="form-footer-text">
          Back to <a href="/signin/">Sign In</a>
        </div>

      </form>

    </div>

  </div>

</section>
